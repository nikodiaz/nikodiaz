name: GitHub Profile Summary Cards
 
on:
  schedule:
    - cron: "0 6 * * *" # una vez por día
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions
 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
 
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false # su commit interno falla; lo hacemos nosotros abajo
 
      - name: Commit de las tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            echo "Sin cambios en las tarjetas"
            exit 0
          fi
          git commit -m "Actualizar tarjetas de estadísticas"
          git push
 
